services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"

  app:
    build: .
    environment:
      # The service name, not localhost -- inside Compose, containers
      # reach each other by service name.
      QDRANT_URL: http://qdrant:6333
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # DynamoDB holds the article text now (F-079). boto3 needs these to
      # even construct a client -- ~/.aws on your HOST is invisible inside
      # the container, so nothing here is redundant with `aws configure`.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    volumes:
      # The response cache. Without this it is lost on every restart and
      # every repeat question costs a call again.
      - ./eval/responses:/app/eval/responses
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
    # Reuse the volume you already loaded, rather than starting empty.
    external: true
